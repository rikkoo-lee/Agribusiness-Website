        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
               <!-- LOAD DATA -->
        <script src="js/videoData.js"></script>
        
        <!-- APPLY LOGIC -->
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            let currentVideoId = urlParams.get('id');

            // SMART FALLBACK: If they forgot the "id=" in the link, it will still grab the video ID from the URL
            if (!currentVideoId) {
                const rawUrl = window.location.search; // Gets "?pn_5zH0APsQ"
                if (rawUrl && rawUrl.length > 1) {
                    currentVideoId = rawUrl.substring(1).replace('id=', ''); 
                }
            }

            // If it STILL can't find an ID, fallback to the first video
            if (!currentVideoId || currentVideoId === '') {
                currentVideoId = 'R8HVIePMIPE';
            }
            
            // Default fallback if ID isn't in the database
            const data = videoData[currentVideoId] || {
                title: 'Agribusiness Video',
                category: 'Catalog',
                desc: 'Click the thumbnail to watch on YouTube.'
            };

            document.getElementById('mainVideoTitle').innerText = data.title;
            document.getElementById('mainVideoCategory').innerText = data.category;
            document.getElementById('mainVideoDesc').innerText = data.desc;
            document.getElementById('mainVideoThumb').src = `https://img.youtube.com/vi/${currentVideoId}/maxresdefault.jpg`;
            document.getElementById('mainVideoLink').href = `https://www.youtube.com/watch?v=${currentVideoId}`;
        </script>
